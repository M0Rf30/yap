name: 📡 Publish MCP Server

# Builds the dedicated yap-mcp OCI image and publishes the server to the
# official MCP registry (registry.modelcontextprotocol.io).
#
# Runs on version tags after release artifacts exist. The OCI image is the
# package referenced by server.json (registryType: oci).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without v prefix, e.g. 2.2.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/m0rf30/yap-mcp

jobs:
  image:
    name: 🐳 Build & push yap-mcp image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🏷️ Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            V="${INPUT_VERSION}"
          else
            V="${GITHUB_REF#refs/tags/v}"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "Invalid version: ${V}" >&2
            exit 1
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: 🔧 Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: build/mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=v${{ steps.ver.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest

  publish:
    name: 📡 Publish to MCP registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: image
    permissions:
      contents: read
      id-token: write # required for MCP registry GitHub OIDC auth
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🏷️ Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            V="${INPUT_VERSION}"
          else
            V="${GITHUB_REF#refs/tags/v}"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "Invalid version: ${V}" >&2
            exit 1
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: 🔄 Inject tag version into server.json
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          # server.json ships with a 0.0.0 placeholder; the git tag is the
          # single source of truth. OCI packages carry the version as the image
          # tag in `identifier` (no `version` field is allowed), so rewrite the
          # tag suffix and the top-level server version.
          jq --arg v "$V" \
            '.version = $v
             | .packages[].identifier |= (sub(":[^:]*$"; "") + ":" + $v)' \
            server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json

      - name: 📥 Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          f=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$f" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${f}"
          echo "${MCP_PUBLISHER_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: 🔐 Authenticate (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: 📡 Publish
        run: mcp-publisher publish

  # Bump the Claude Code plugin manifest version to match the tag and commit it
  # back to the default branch. plugin.json is read from the repo at install
  # time, so unlike server.json it must be persisted (not just injected in CI).
  plugin-version:
    name: 🔖 Sync plugin.json version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: image
    permissions:
      contents: write
    steps:
      - name: 📂 Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 🏷️ Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            V="${INPUT_VERSION}"
          else
            V="${GITHUB_REF#refs/tags/v}"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "Invalid version: ${V}" >&2
            exit 1
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: 🔖 Update & commit plugin.json
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          jq --arg v "$V" '.version = $v' \
            .claude-plugin/plugin.json > .claude-plugin/plugin.json.tmp
          mv .claude-plugin/plugin.json.tmp .claude-plugin/plugin.json
          if git diff --quiet; then
            echo "plugin.json already at ${V}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          git commit -m "chore(plugin): sync plugin.json version to ${V} [skip ci]"
          git push
