name: 🔒 Security Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run security scan every day at 6:00 AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"

jobs:
  # ===================================
  # Static Analysis Security Testing
  # ===================================
  sast:
    name: 🔍 Static Analysis
    uses: ./.github/workflows/_reusable-security-scan.yml
    with:
      go-version: "1.27.0"
      upload-sarif: true
      run-sast: true
      run-vulncheck: false

  # ===================================
  # Vulnerability Scanning
  # ===================================
  vulnerability-scan:
    name: 🛡️ Vulnerability Scan
    uses: ./.github/workflows/_reusable-security-scan.yml
    with:
      go-version: "1.27.0"
      upload-sarif: false
      run-vulncheck: true

  # ===================================
  # License Compliance Check
  # ===================================
  license-check:
    name: 📜 License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 🐹 Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 📥 Download dependencies
        run: go mod download

      - name: 📜 Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0

      - name: 🔍 Check license compliance
        id: license-check
        run: |
          echo "🔍 Checking license compliance..."

          # Create licenses directory
          mkdir -p licenses

          # Generate license report
          {
            echo "## 📜 License Compliance Report"
            echo ""
            echo "**Generated:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
          } > licenses/report.md

          # Fail on forbidden/restricted (e.g. GPL/AGPL) dependency licenses.
          STATUS=0

          if go-licenses check --disallowed_types=forbidden,restricted ./...; then
            echo "result=compliant" >> "$GITHUB_OUTPUT"
            {
              echo "### ✅ License Compliance"
              echo "All dependencies use compatible licenses."
            } >> licenses/report.md
          else
            STATUS=1
            echo "result=issues_found" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ License Issues Found"
              echo "Some dependencies may have licensing issues. Review required."
            } >> licenses/report.md
          fi

          {
            echo ""
            echo "### 📋 Dependency Licenses"
            echo ""
          } >> licenses/report.md

          # List all licenses
          go-licenses report ./... >> licenses/report.md 2>/dev/null || echo "Unable to generate detailed license report" >> licenses/report.md

          exit "$STATUS"

      - name: 📤 Upload license compliance results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: license-compliance-results
          path: licenses/
          retention-days: 30

  # ===================================
  # Secrets Detection
  # ===================================
  secrets-detection:
    name: 🔐 Secrets Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 🔐 Run TruffleHog secrets detection
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          base: main
          path: ./
          extra_args: --results=verified,unknown

  # ===================================
  # Container Security Scanning
  # ===================================
  container-security:
    name: 🐳 Container Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    strategy:
      matrix:
        os: [alpine, ubuntu-jammy]

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: 🔨 Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: build/deploy/${{ matrix.os }}/Dockerfile
          tags: yap-${{ matrix.os }}:security-scan
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🛡️ Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: yap-${{ matrix.os }}:security-scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # ===================================
  # Security Summary Report
  # ===================================
  security-summary:
    name: 📊 Security Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [sast, vulnerability-scan, license-check, secrets-detection, container-security]
    if: always()

    steps:
      - name: 📥 Download security artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-results"
          merge-multiple: true

      - name: 📝 Generate security summary
        run: |
          {
            echo "## 🔒 Security Analysis Summary"
            echo ""
            echo "**Analysis Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "**Trigger:** ${{ github.event_name }}"
            echo ""
            echo "### 📋 Security Checks"
            echo "| Check | Status | Details |"
            echo "|-------|--------|---------|"
            echo "| 🔍 Static Analysis | ${{ needs.sast.result }} | Gosec security scanner |"
            echo "| 🛡️ Vulnerability Scan | ${{ needs.vulnerability-scan.result }} | Go vulnerability database |"
            echo "| 📜 License Compliance | ${{ needs.license-check.result }} | Dependency license check |"
            echo "| 🔐 Secrets Detection | ${{ needs.secrets-detection.result }} | TruffleHog scan |"
            echo "| 🐳 Container Security | ${{ needs.container-security.result }} | Trivy image scan (scheduled/manual) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Overall security status
          if [[ "${{ needs.sast.result }}" == "success" && \
                "${{ needs.vulnerability-scan.result }}" == "success" && \
                "${{ needs.license-check.result }}" == "success" && \
                "${{ needs.secrets-detection.result }}" == "success" && \
                ( "${{ needs.container-security.result }}" == "success" || \
                  "${{ needs.container-security.result }}" == "skipped" ) ]]; then
            {
              echo "### ✅ Overall Security Status: PASS"
              echo "All security checks completed successfully."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ⚠️ Overall Security Status: REVIEW REQUIRED"
              echo "Some security checks require attention. Please review the failed checks above."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo ""
            echo "### 🔗 Security Resources"
            echo "- [Security Policy](https://github.com/${{ github.repository }}/security/policy)"
            echo "- [Security Advisories](https://github.com/${{ github.repository }}/security/advisories)"
            echo "- [Dependency Graph](https://github.com/${{ github.repository }}/network/dependencies)"
            echo "- [Go Vulnerability Database](https://vuln.go.dev/)"
          } >> "$GITHUB_STEP_SUMMARY"
